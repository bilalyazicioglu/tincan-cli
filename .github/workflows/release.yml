name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners per architecture: audiopus_sys builds Opus from C
          # source via cmake, which makes cross-compiling far more fragile than
          # it is worth. ubuntu-22.04 (glibc 2.35) keeps the Linux binaries
          # usable on older distributions.
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN=target/${{ matrix.target }}/release/tincan
          strip "$BIN" || true
          ASSET=tincan-${{ matrix.target }}.tar.gz
          tar -czf "$ASSET" -C "$(dirname "$BIN")" tincan
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tincan-${{ matrix.target }}
          path: |
            tincan-${{ matrix.target }}.tar.gz
            tincan-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            artifacts/*
