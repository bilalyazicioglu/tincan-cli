name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      OPUS_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set CFLAGS for Linux
        if: runner.os == 'Linux'
        run: echo "CFLAGS=-fPIC" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libasound2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix)/opt/libtool/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the binary is self-contained
        run: |
          BIN=target/${{ matrix.target }}/release/tincan
          if [ "${{ runner.os }}" = "macOS" ]; then
            LINKS=$(otool -L "$BIN")
            otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos || true
          else
            LINKS=$(ldd "$BIN")
          fi
          echo "$LINKS"
          if echo "$LINKS" | grep -qi 'libopus'; then
            echo "::error::tincan links libopus dynamically; the released binary would not run without it"
            exit 1
          fi

      - name: Package
        run: |
          BIN=target/${{ matrix.target }}/release/tincan
          strip "$BIN" || true
          ASSET=tincan-${{ matrix.target }}.tar.gz
          tar -czf "$ASSET" -C "$(dirname "$BIN")" tincan
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tincan-${{ matrix.target }}
          path: |
            tincan-${{ matrix.target }}.tar.gz
            tincan-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --generate-notes artifacts/*
          fi

      - name: Update Homebrew Tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ARM64_SHA=$(cut -d' ' -f1 artifacts/tincan-aarch64-apple-darwin.tar.gz.sha256)
          LINUX_SHA=$(cut -d' ' -f1 artifacts/tincan-x86_64-unknown-linux-gnu.tar.gz.sha256)
          SOURCE_SHA=$(curl -fsSL "https://github.com/bilalyazicioglu/tincan-cli/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)

          git clone "https://x-access-token:${GH_TOKEN}@github.com/bilalyazicioglu/homebrew-tap.git" tap || exit 0
          cat <<EOF > tap/Formula/tincan.rb
          class Tincan < Formula
            desc "Serverless peer-to-peer voice and text chat for your terminal"
            homepage "https://github.com/bilalyazicioglu/tincan-cli"
            version "${VERSION}"
            license "MIT"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/bilalyazicioglu/tincan-cli/releases/download/${TAG}/tincan-aarch64-apple-darwin.tar.gz"
              sha256 "${ARM64_SHA}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/bilalyazicioglu/tincan-cli/releases/download/${TAG}/tincan-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${LINUX_SHA}"
            else
              url "https://github.com/bilalyazicioglu/tincan-cli/archive/refs/tags/${TAG}.tar.gz"
              sha256 "${SOURCE_SHA}"
            end

            def install
              if File.exist?("tincan")
                bin.install "tincan"
              else
                system "cargo", "install", *std_cargo_args
              end
              generate_completions_from_executable(bin/"tincan", "completions")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tincan --version")
              assert_match "completions", shell_output("#{bin}/tincan --help")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tincan.rb
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): bump tincan to ${TAG}" && git push origin main) || true

