name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      OPUS_STATIC: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          # macos-13 is retired and macos-15-intel is the standard label that
          # replaced it. It is also the last x86_64 macOS image Actions will
          # offer; when it goes in August 2027 this target has to be built
          # somewhere else or dropped.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          # Native arm64, so no qemu and no cross toolchain.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # audiopus_sys ships a prebuilt libopus.lib for MSVC and OPUS_STATIC
          # picks it up, so Windows needs no system dependencies at all.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set CFLAGS for Linux
        if: runner.os == 'Linux'
        run: echo "CFLAGS=-fPIC" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libasound2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix)/opt/libtool/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the binary is self-contained
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/tincan
          if [ "${{ runner.os }}" = "macOS" ]; then
            LINKS=$(otool -L "$BIN")
            otool -l "$BIN" | grep -A3 LC_BUILD_VERSION | grep minos || true
          else
            LINKS=$(ldd "$BIN")
          fi
          echo "$LINKS"
          if echo "$LINKS" | grep -qi 'libopus'; then
            echo "::error::tincan links libopus dynamically; the released binary would not run without it"
            exit 1
          fi

      # There is no ldd here, so the check is the other way round: a statically
      # linked Opus leaves no DLL beside the binary. One appearing means
      # OPUS_STATIC did not take and the .zip would ship half an application.
      - name: Verify the binary is self-contained (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "target/${{ matrix.target }}/release"
          $dlls = Get-ChildItem -Path $dir -Filter "*opus*.dll" -ErrorAction SilentlyContinue
          if ($dlls) {
            Write-Output "::error::tincan links Opus dynamically; the released binary would not run without $($dlls.Name)"
            exit 1
          }
          Write-Output "no Opus DLL beside the binary; Opus is linked statically"

      - name: Package
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/tincan
          strip "$BIN" || true
          ASSET=tincan-${{ matrix.target }}.tar.gz
          tar -czf "$ASSET" -C "$(dirname "$BIN")" tincan
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      # A .zip rather than a .tar.gz: Windows opens one in Explorer and needs a
      # tool for the other. Get-FileHash prints a bare uppercase digest, so the
      # checksum file is assembled by hand to match the `<sha>  <file>` shape
      # the installer, the tap and the npm shim all read with `cut -d' ' -f1`.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/tincan.exe"
          $asset = "tincan-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Out-File -FilePath "$asset.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: tincan-${{ matrix.target }}
          path: |
            tincan-${{ matrix.target }}.tar.gz
            tincan-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: tincan-${{ matrix.target }}
          path: |
            tincan-${{ matrix.target }}.zip
            tincan-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Only a tag publishes. Without this guard a workflow_dispatch run — the
      # way to rehearse a release before committing to it — would create a
      # public release named after whatever branch it was started from. The
      # artifacts are uploaded either way, so a dispatch run still answers the
      # question it was started to answer: did all five targets build.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --generate-notes artifacts/*
          fi

      - name: Update Homebrew Tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          MAC_ARM_SHA=$(cut -d' ' -f1 artifacts/tincan-aarch64-apple-darwin.tar.gz.sha256)
          MAC_INTEL_SHA=$(cut -d' ' -f1 artifacts/tincan-x86_64-apple-darwin.tar.gz.sha256)
          LINUX_INTEL_SHA=$(cut -d' ' -f1 artifacts/tincan-x86_64-unknown-linux-gnu.tar.gz.sha256)
          LINUX_ARM_SHA=$(cut -d' ' -f1 artifacts/tincan-aarch64-unknown-linux-gnu.tar.gz.sha256)
          SOURCE_SHA=$(curl -fsSL "https://github.com/bilalyazicioglu/tincan-cli/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)

          # Without an explicit token this falls back to github.token, which is
          # scoped to this repository and cannot push to the tap. That is not a
          # condition to paper over: it silently left `brew install tincan` on
          # v0.2.3 through two releases, because the push failed and the step
          # swallowed it.
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; the tap cannot be updated and brew users would stay on the previous release"
            exit 1
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/bilalyazicioglu/homebrew-tap.git" tap
          cat <<EOF > tap/Formula/tincan.rb
          class Tincan < Formula
            desc "Serverless peer-to-peer voice and text chat for your terminal"
            homepage "https://github.com/bilalyazicioglu/tincan-cli"
            version "${VERSION}"
            license "MIT"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/bilalyazicioglu/tincan-cli/releases/download/${TAG}/tincan-aarch64-apple-darwin.tar.gz"
              sha256 "${MAC_ARM_SHA}"
            elsif OS.mac? && Hardware::CPU.intel?
              url "https://github.com/bilalyazicioglu/tincan-cli/releases/download/${TAG}/tincan-x86_64-apple-darwin.tar.gz"
              sha256 "${MAC_INTEL_SHA}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/bilalyazicioglu/tincan-cli/releases/download/${TAG}/tincan-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${LINUX_INTEL_SHA}"
            elsif OS.linux? && Hardware::CPU.arm?
              url "https://github.com/bilalyazicioglu/tincan-cli/releases/download/${TAG}/tincan-aarch64-unknown-linux-gnu.tar.gz"
              sha256 "${LINUX_ARM_SHA}"
            else
              url "https://github.com/bilalyazicioglu/tincan-cli/archive/refs/tags/${TAG}.tar.gz"
              sha256 "${SOURCE_SHA}"
            end

            def install
              if File.exist?("tincan")
                bin.install "tincan"
              else
                system "cargo", "install", *std_cargo_args
              end
              generate_completions_from_executable(bin/"tincan", "completions")
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/tincan --version")
              assert_match "completions", shell_output("#{bin}/tincan --help")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tincan.rb
          if git diff --staged --quiet; then
            echo "the formula already describes ${TAG}; nothing to push"
          else
            git commit -m "chore(release): bump tincan to ${TAG}"
            git push origin main
          fi

