name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # Formatting is the same on every OS, so it runs once rather than in the matrix.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update

      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      OPUS_STATIC: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set CFLAGS for Linux
        if: runner.os == 'Linux'
        run: echo "CFLAGS=-fPIC" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libasound2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix)/opt/libtool/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The branch ruleset needs one status check whose name never moves. The matrix
  # jobs report as `test (ubuntu-latest)`, `test (macos-15)` and so on, so requiring
  # those directly would break the rule the moment the matrix gains or renames an OS.
  # This job is that fixed name, and it is nothing but a verdict on the matrix.
  gate:
    name: build/test/ci
    runs-on: ubuntu-latest
    needs: [fmt, test]
    # Without `always()` a failed or skipped matrix would skip the gate too, and a
    # skipped required check counts as satisfied — the rule would wave through
    # exactly what it exists to stop.
    if: always()
    steps:
      - name: Require formatting and the test matrix to have passed
        run: |
          fmt='${{ needs.fmt.result }}'
          test='${{ needs.test.result }}'
          if [ "$fmt" != "success" ]; then
            echo "cargo fmt --check did not pass: $fmt (run cargo fmt and push again)"
            exit 1
          fi
          if [ "$test" != "success" ]; then
            echo "test matrix did not pass: $test"
            exit 1
          fi
          echo "formatting and test matrix passed"
