name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      OPUS_STATIC: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set CFLAGS for Linux
        if: runner.os == 'Linux'
        run: echo "CFLAGS=-fPIC" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config libasound2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool
          echo "$(brew --prefix)/opt/libtool/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The branch ruleset needs one status check whose name never moves. The matrix
  # jobs report as `test (ubuntu-latest)` / `test (macos-14)`, so requiring those
  # directly would break the rule the moment the matrix gains or renames an OS.
  # This job is that fixed name, and it is nothing but a verdict on the matrix.
  gate:
    name: build/test/ci
    runs-on: ubuntu-latest
    needs: [test]
    # Without `always()` a failed or skipped matrix would skip the gate too, and a
    # skipped required check counts as satisfied — the rule would wave through
    # exactly what it exists to stop.
    if: always()
    steps:
      - name: Require the test matrix to have passed
        run: |
          result='${{ needs.test.result }}'
          if [ "$result" != "success" ]; then
            echo "test matrix did not pass: $result"
            exit 1
          fi
          echo "test matrix passed"
