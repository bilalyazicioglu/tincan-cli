[package]
# `tincan` and `tincan-cli` were both taken on crates.io by unrelated crates
# before this project existed. Only the published crate name moves; the binary,
# the repository and the npm package stay as they are, which is what the [lib]
# and [[bin]] sections below pin down.
name = "tincan-chat"
version = "0.3.1"
edition = "2024"
rust-version = "1.91"
description = "Serverless peer-to-peer voice and text chat for your terminal"
repository = "https://github.com/bilalyazicioglu/tincan-cli"
readme = "README.md"
license = "MIT"
keywords = ["voice", "chat", "p2p", "terminal", "tui"]
categories = ["command-line-utilities", "network-programming", "multimedia::audio"]
# The demo recordings are 5 MB of the repository and nothing that `cargo install`
# needs; crates.io resolves the README's image links against the repository
# anyway, so they still render there.
exclude = ["assets/demo.gif", "assets/demo.mp4"]

# Published as `tincan-chat`, but `use tincan::` keeps working in the tests and
# the installed command is still `tincan`.
[lib]
name = "tincan"
path = "src/lib.rs"

[[bin]]
name = "tincan"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
audiopus = "0.2.0"
blake2 = "0.10.6"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6"
cpal = "0.18.1"
crossterm = "0.29.0"
data-encoding = "2.11.1"
iroh = "1"
n0-future = "0.3.2"
nnnoiseless = { version = "0.5.2", default-features = false }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
ratatui = "0.30.2"
rtrb = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# Argon2 is unacceptably slow in a debug build; optimize just that package.
[profile.dev.package.argon2]
opt-level = 3
