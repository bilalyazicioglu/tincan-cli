[package]
name = "tincan"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Serverless peer-to-peer voice and text chat for your terminal"
repository = "https://github.com/bilalyazicioglu/tincan-cli"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
audiopus = "0.2.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.1"
crossterm = "0.29.0"
data-encoding = "2.11.1"
iroh = "1"
n0-future = "0.3.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.2"
ratatui = "0.30.2"
rtrb = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Argon2 is unacceptably slow in a debug build; optimize just that package.
[profile.dev.package.argon2]
opt-level = 3
